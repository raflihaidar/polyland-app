server {

    listen 80;

    server_name jejaktanahku.raflihaidar.my.id;


    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    location / {
        return 301 https://$host$request_uri;
    }
}



server {

    listen 443 ssl;

    server_name jejaktanahku.raflihaidar.my.id;


    ssl_certificate /etc/letsencrypt/live/jejaktanahku.raflihaidar.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jejaktanahku.raflihaidar.my.id/privkey.pem;


    location /api/ {

        proxy_pass http://jejaktanahku-be:5000/;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
    }


    location / {

        proxy_pass http://jejaktanahku-app:80/;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
    }
}