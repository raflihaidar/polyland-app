server {

    listen 80;

    server_name jejaktanahku.raflihaidar.my.id;


    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    location / {

        proxy_pass http://jejaktanahku-app:80;

        proxy_set_header Host $host;

    }


    location /api/ {

        proxy_pass http://jejaktanahku-be:5000;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto https;

    }
}