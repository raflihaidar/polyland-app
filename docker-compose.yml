services:
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf:/etc/nginx/templates
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

    networks:
      - jejaktanahku-network

  certbot:
    image: certbot/certbot
    restart: unless-stopped

    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

  jejaktanahku-app:
    container_name: jejaktanahku-app

    build: .

    restart: unless-stopped

    expose:
      - "80"

    networks:
      - jejaktanahku-network

networks:
  jejaktanahku-network:
    external: true
